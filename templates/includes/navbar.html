{% load static %}

<header class="section-header" style="background-color: #f8fafc; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
<nav class="navbar p-md-0 navbar-expand-sm navbar-light border-bottom" style="background-color: #0f172a; border-color: #1e293b !important;">
<div class="container">
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarTop4" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarTop4">
    <ul class="navbar-nav mr-auto">
      <li class="nav-item dropdown">
      <a href="#" class="nav-link"></a>
    </li>
    <li class="nav-item dropdown">
      <a href="#" class="nav-link"></a>
    </li>
    </ul>
  </div> <!-- navbar-collapse .// -->
</div> <!-- container //  -->
</nav>

<section class="header-main border-bottom" style="background-color: #ffffff; padding: 15px 0; border-bottom: 2px solid #e2e8f0 !important;">
  <div class="container">
<div class="row align-items-center">
  
  <!-- Logo -->
  <div class="col-lg-2 col-md-3 col-6">
    <a href="{% url 'home' %}" class="brand-wrap">
      <img class="logo" src="{% static './images/logo02.png' %}" style="max-height: 42px; width: auto; object-fit: contain;">
    </a> <!-- brand-wrap.// -->
  </div>

  <!-- Categorías Dropdown -->
  <div class="col-lg col-sm col-md col-6 flex-grow-0">
    <div class="category-wrap dropdown d-inline-block float-right">
      <button type="button" class="btn dropdown-toggle" data-toggle="dropdown" style="background-color: #4f46e5; color: #ffffff; font-weight: 600; border-radius: 8px; border: none; padding: 10px 16px;">
        <i class="fa fa-graduation-cap" style="margin-right: 6px;"></i> Cursos y Categorías
      </button>
      <div class="dropdown-menu" style="border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0;">
        <a class="dropdown-item" href="{% url 'store' %}" style="font-weight: 600; color: #4f46e5;">Mostrar Todos</a>
        <div class="dropdown-divider"></div>
        {% for category in links %}
        <a class="dropdown-item" href="{{ category.get_url }}" style="color: #334155; padding: 8px 16px;">{{ category.category_name }}</a>
        {% endfor %}
      </div>
    </div>  <!-- category-wrap.// -->
  </div> <!-- col.// -->

  <!-- Botón Tienda -->
  <div class="col-auto px-2">
    <a href="{% url 'store' %}" class="btn" style="border: 2px solid #4f46e5; color: #4f46e5; font-weight: 600; border-radius: 8px; padding: 8px 16px; background-color: transparent;">Explorar</a>
  </div>

  <!-- Buscador -->
  <div class="col-lg col-md-6 col-sm-12 col">
    <form action="{% url 'search' %}" class="search">
      <div class="input-group w-100">
          <input type="text" class="form-control" style="width:60%; border-radius: 8px 0 0 8px; border: 2px solid #cbd5e1; border-right: none; padding: 10px;" placeholder="¿Qué querés aprender hoy? (ej. Python, Django...)" name="keyword">
          <div class="input-group-append">
            <button class="btn" type="submit" style="background-color: #4f46e5; border-radius: 0 8px 8px 0; border: 2px solid #4f46e5; color: #ffffff; padding: 0 16px;">
              <i class="fa fa-search"></i>
            </button>
          </div>
        </div>
    </form> <!-- search-wrap .end// -->
  </div> <!-- col.// -->

  <!-- Zona de Usuario y Carrito -->
  <div class="col-lg-3 col-sm-6 col-8 order-2 order-lg-3">
        <div class="d-flex justify-content-end align-items-center mb-3 mb-lg-0">

          {% if user.id is None %}
          <div class="widget-header text-right" style="margin-right: 15px;">
            <small class="title" style="color: #64748b; display: block; font-size: 11px;">¡Potencia tu carrera!</small>
            <div>
              <a href="{% url 'login' %}" style="color: #4f46e5; font-weight: 600; text-decoration: none;">Iniciar Sesión</a> 
              <span style="color: #cbd5e1;"> | </span>
              <a href="{% url 'register' %}" style="color: #059669; font-weight: 600; text-decoration: none;"> Registrarse </a>
            </div>
          </div>

          {% else %}

          <div class="widget-header text-right" style="margin-right: 15px;">
            <small class="title" style="color: #64748b; display: block; font-size: 11px;">Hola de nuevo,</small>
            <div>
              <a href="{% url 'dashboard' %}" style="color: #4f46e5; font-weight: 600; text-decoration: none;">{{ user.first_name }}</a> 
              <span style="color: #cbd5e1;"> | </span>
              <a href="{% url 'logout' %}" style="color: #ef4444; font-weight: 600; text-decoration: none;"> Salir </a>
            </div>
          </div>

          {% endif %}

          <!-- Carrito estilo plataforma de cursos -->
          <a href="{% url 'cart' %}" class="widget-header position-relative" style="text-decoration: none;">
            <div class="icon icon-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 42px; height: 42px; background-color: #f1f5f9; border: 2px solid #e2e8f0; color: #4f46e5; transition: all 0.2s;">
              <i class="fa fa-shopping-cart"></i>
            </div>
            <span class="badge badge-pill" style="position: absolute; top: -5px; right: -5px; background-color: #10b981; color: white; font-size: 10px; padding: 4px 6px; border-radius: 50%;">{{ cart_count }}</span>
          </a>

        </div> <!-- widgets-wrap.// -->
      </div> <!-- col.// -->

</div> <!-- row.// -->
  </div> <!-- container.// -->
</section> <!-- header-main .// -->

</header> <!-- section-header.// -->
